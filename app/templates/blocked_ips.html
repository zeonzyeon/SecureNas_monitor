<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blocked IPs - SecureNas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
  </head>
  <body data-page="blocked-ips">
    <aside class="sidebar" aria-label="Primary">
      <div class="brand">
        <div class="brand-mark">SN</div>
        <div>
          <p class="brand-name">SecureNas</p>
          <p class="brand-subtitle">Access Monitor</p>
        </div>
      </div>
      <nav class="nav">
        <a class="nav-item" href="{{ url_for('main.dashboard') }}">Dashboard</a>
        <div class="nav-subtree" aria-label="Dashboard 하위 메뉴">
          <a class="nav-item nav-subitem" href="{{ url_for('main.users_page') }}">Users</a>
          <a class="nav-item nav-subitem" href="{{ url_for('main.file_events_page') }}">File Events</a>
          <a class="nav-item nav-subitem" href="{{ url_for('main.security_logs_page') }}">Security Logs</a>
        </div>
        <a class="nav-item active" href="{{ url_for('main.blocked_ips_page') }}">Blocked IPs</a>
        <a class="nav-item" href="{{ url_for('main.files') }}">Files</a>
        <a class="nav-item" href="{{ url_for('main.settings_page') }}">Settings</a>
      </nav>
    </aside>

    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Network Guard</p>
          <h1>IP 차단 관리</h1>
        </div>
        <div class="topbar-actions">
          <a class="text-button" href="{{ url_for('main.dashboard') }}">대시보드</a>
          <button class="icon-button" type="button" id="refreshButton" title="새로고침" aria-label="새로고침">↻</button>
        </div>
      </header>

      <section class="panel ip-blocks-panel">
        <div class="panel-header">
          <div>
            <h2>차단 IP</h2>
            <p>로그인 실패로 차단된 IP와 수동 차단 상태를 관리합니다.</p>
          </div>
          <span class="save-state" id="ipBlockSaveState" aria-live="polite"></span>
        </div>
        <form class="inline-form" id="manualBlockForm">
          <input id="manualBlockIp" name="ip_address" placeholder="IP 주소" autocomplete="off">
          <div class="time-input">
            <input id="manualBlockMinutes" name="minutes" type="number" min="1" max="1440" value="10" aria-label="차단 시간">
            <span aria-hidden="true">분</span>
          </div>
          <button class="small-button" type="submit">차단</button>
        </form>
        <div class="table-wrap">
          <table>
            <colgroup>
              <col class="ip-address-col">
              <col class="ip-fail-col">
              <col class="ip-time-col">
              <col class="ip-time-col">
              <col class="ip-time-col">
              <col class="ip-action-col">
            </colgroup>
            <thead>
              <tr>
                <th>IP</th>
                <th>실패</th>
                <th>최근 실패</th>
                <th>차단 시작</th>
                <th>해제 시각</th>
                <th>작업</th>
              </tr>
            </thead>
            <tbody id="ipBlocksTable"></tbody>
          </table>
        </div>
        <div class="empty-state" id="ipBlocksEmptyState">
          <strong>차단 또는 실패 기록이 없습니다.</strong>
          <span>로그인 실패가 누적되거나 관리자가 IP를 차단하면 여기에 표시됩니다.</span>
        </div>
      </section>
    </main>
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
  </body>
</html>
