<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SecureNas Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
  </head>
  <body>
    <main class="login-shell">
      <section class="login-panel">
        <div class="brand">
          <div class="brand-mark">SN</div>
          <div>
            <p class="brand-name">SecureNas</p>
            <p class="brand-subtitle">NAS Access Portal</p>
          </div>
        </div>

        <div class="headline">
          <p>Secure login</p>
          <h1>NAS 파일 접근</h1>
        </div>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="alert" role="alert">{{ messages[0] }}</div>
          {% endif %}
        {% endwith %}

        <form method="post" action="{{ url_for('auth.login_post') }}">
          <label for="username">아이디</label>
          <input id="username" name="username" type="text" autocomplete="username" required autofocus>

          <label for="password">비밀번호</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>

          <button type="submit">로그인</button>
        </form>

        <p class="auth-link">계정이 없나요? <a href="{{ url_for('auth.register') }}">계정 등록</a></p>
      </section>
    </main>
  </body>
</html>
