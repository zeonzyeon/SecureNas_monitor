<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SecureNas Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
  </head>
  <body>
    <main class="login-shell">
      <section class="login-panel">
        <div class="brand">
          <div class="brand-mark">SN</div>
          <div>
            <p class="brand-name">SecureNas</p>
            <p class="brand-subtitle">NAS Access Portal</p>
          </div>
        </div>

        <div class="headline">
          <p>Account request</p>
          <h1>계정 등록</h1>
        </div>

        <p class="notice">등록한 계정은 관리자 승인 후 사용할 수 있습니다.</p>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="alert" role="alert">{{ messages[0] }}</div>
          {% endif %}
        {% endwith %}

        <form method="post" action="{{ url_for('auth.register_post') }}">
          <label for="username">아이디</label>
          <input id="username" name="username" type="text" autocomplete="username" minlength="3" required autofocus>

          <label for="password">비밀번호</label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>

          <label for="password_confirm">비밀번호 확인</label>
          <input id="password_confirm" name="password_confirm" type="password" autocomplete="new-password" minlength="8" required>

          <button type="submit">등록 요청</button>
        </form>

        <p class="auth-link">이미 계정이 있나요? <a href="{{ url_for('auth.login') }}">로그인</a></p>
      </section>
    </main>
  </body>
</html>
